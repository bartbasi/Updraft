<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
  <!-- Updraft: a red balloon caught mid-drift, rising on warm air, its string streaming behind.
       Everything sits inside the adaptive icon's safe zone (radius 132 around the centre), which
       no launcher's mask cuts into: the art is drawn larger and scaled down by 0.79. -->
  <defs>
    <radialGradient id="rubber" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#f27a77"/>
      <stop offset="0.55" stop-color="#e0484f"/>
      <stop offset="1" stop-color="#b8333e"/>
    </radialGradient>
  </defs>
  <g transform="translate(216 216) scale(0.79) translate(-216 -216)">
  <!-- Warm air rising under it. -->
  <g fill="none" stroke-linecap="round" stroke-width="11">
    <path d="M128 348 C 104 314, 160 296, 136 258" stroke="#f3b27a" opacity="0.9"/>
    <path d="M300 340 C 276 306, 330 290, 306 252" stroke="#f6c98f" opacity="0.85"/>
  </g>
  <!-- The string, streaming down and back from the knot. -->
  <path d="M210 260 C 200 288, 222 300, 198 324 S 158 344, 160 368" fill="none" stroke="#5d5468"
        stroke-width="5" stroke-linecap="round"/>
  <!-- Little lift marks beside it. -->
  <g fill="none" stroke="#fdfbf8" stroke-linecap="round" stroke-width="8" opacity="0.95">
    <path d="M128 196 L128 168"/>
    <path d="M110 230 L110 210"/>
    <path d="M318 214 L318 190"/>
  </g>
  <!-- The balloon, leaning into its drift. -->
  <g transform="rotate(12 222 170)">
    <ellipse cx="222" cy="170" rx="64" ry="76" fill="url(#rubber)"/>
    <path d="M212 246 L232 246 L226 258 L218 258 Z" fill="#b8333e"/>
    <ellipse cx="196" cy="136" rx="15" ry="24" fill="#fdfbf8" opacity="0.75" transform="rotate(-24 196 136)"/>
    <ellipse cx="222" cy="170" rx="64" ry="76" fill="none" stroke="#5d5468" stroke-width="5"/>
  </g>
  </g>
</svg>
